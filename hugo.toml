baseURL                = "http://qgustavor.github.io/"   # Your domain name. Must end with "/"
theme                  = "introduction"
DefaultContentLanguage = "pt"          # Default language for multilingual sites
# disqusshortname      = ""            # https://gohugo.io/content-management/comments
# Configure Google Analytics 4 with [services.googleAnalytics] and id = "G-MEASUREMENT_ID".

[params]
  themeStyle    = "auto"              # Choose "light" or "dark" or "auto"
  favicon       = "/favicon.ico"      # Path to favicon file
  showMenu      = true                # Show navigation menu
  showRSSButton = false               # Show rss button in navigation
  fadeIn        = false               # Turn on/off the fade-in effect
  fadeInIndex   = true                # Turn on/off the fade-in effect on the index page even if fade-in was otherwise turned off
  dateFormat    = "02/01/2006"
  # email       = "youremail@email.com"   # E-mail address for contact section
  customCSS     = ["custom.css"]          # Include custom css files placed under assets/
  # customJS    = ["foo.js"]              # Include custom JavaScript files placed under assets/
  # plausible   = true                    # Use Plausible analytics (requires an account at Plausible.io)

  # Configure the home page
  [params.home]
    introHeight        = "fullheight"      # Input either "medium" or "large" or "fullheight"
    showLatest         = true              # Show latest blog post summary
    showAllPosts       = false             # Set true to list all posts on home page, or set false to link to separate blog list page
    allPostsArchiveFormat  = true          # show all posts in an archive format
    numberOfProjectsToShow = 3             # Maximum number of projects to show on home page. Unset or comment out to show all projects
    localTime        = true                # Show your current local time in contact section
    timeZone         = "America/Sao_Paulo" # Your timezone as in the TZ* column of this list: https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
    timeFormat       = "pt-BR"             # Language specific format to use
  [params.projects]
    useTwoColumns      = false             # Use a layout with two columns instead of three

  # Share buttons on blog post pages
  [params.share]
    twitter          = false
    facebook         = false
    pinterest        = false

  # To enable giscus, the GitHub-discussions-based comment section,
  # input the repository for the discussions below. For more details, see
  # https://www.joelnitta.com/posts/2021-11-24_using-giscus/
  # and https://github.com/giscus/giscus
  [params.giscus]
    repo = "qgustavor/qgustavor.github.io" # Entering repo will enable giscus
    repo-id = "MDEwOlJlcG9zaXRvcnk3NzA3OTcyNA=="
    category = "Comments"
    category-id = "DIC_kwDOBJgkrM4DG9La"
    mapping = "pathname"
    reactions-enabled = "1"
    emit-metadata = "0"
    theme = "preferred_color_scheme"
    lang = "pt"

  # Social icons appear in introduction and contact section. Add as many more as you like.
  # Icon pack "fab" includes social network icons, see: https://fontawesome.com/search?ic=free-collection&ip=brands
  # Icon pack "fas" includes solid style icons, see: https://fontawesome.com/search?ic=free-collection&f=classic&s=solid
  # icon is the icon name without the 'fa-'
  [[params.social]]
    url   = "https://github.com/qgustavor"
    icon  = "github"
    icon_pack = "fab"
  [[params.social]]
    url   = "https://urusai.social/@qgustavor"
    icon  = "mastodon"
    icon_pack = "fab"
    html_attributes = "rel=\"me\""
  [[params.social]]
    url   = "https://ursal.zone/@gustavo"
    icon  = "mastodon"
    icon_pack = "fab"
    html_attributes = "rel=\"me\" class=\"br-mastodon\""

# If you don't want to use the default menu, you can define one by yourself
# [[menu.main]]
#   name  = "Home"
#   url   = "/"
#   weight  = 0
# [[menu.main]]
#   name  = "Blog"
#   url   = "/blog/"
#   weight  = 1

# We only use tag as a taxonomies
# You can add more by yourself
# [taxonomies]
#   tag = "tags"
#   series = "series"

[markup]
  defaultMarkdownHandler = "goldmark"
  [markup.goldmark]
  [markup.goldmark.renderer]
  unsafe = true
  [markup.highlight]
  codeFences = true
  guessSyntax = false
  hl_Lines = ""
  lineNoStart = 1
  lineNos = false
  lineNumbersInTable = true
  # noClasses = true
  # For styles, see https://xyproto.github.io/splash/docs/longer/all.html
  style = "solarized-dark"
  tabWidth = 4

[languages]
  [languages.en]
    label   = "English"
    locale   = "en-us"
    weight       = 0
    title      = "Gustavo's Ideas"
    [languages.en.params]
      description  = "A website where Gustavo places his random ideas and some of his crazy projects."   # Max 160 characters show in search results
      # footerText   = "" # Text to override default footer text (markdown allowed)

  [languages.pt]
    label   = "Português"
    locale   = "pt-br"
    weight       = 1
    title      = "Ideias do Gustavo"
    [languages.pt.params]
      description  = "Um website onde Gustavo escreve suas ideias aleatórias e alguns de seus projetos malucos."
      # footerText   = ""

[caches]
  [caches.images]
  dir = ':cacheDir/images'
